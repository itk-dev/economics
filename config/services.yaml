# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

imports:
    - { resource: create_project_config.local.yaml, ignore_errors: true }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

        bind:
            $defaultInvoiceDescriptionTemplate: "%env(APP_INVOICE_DESCRIPTION_TEMPLATE)%"
            $invoiceSupplierAccount: "%env(string:APP_INVOICE_SUPPLIER_ACCOUNT)%"
            $invoiceExternalReceiverAccount: "%env(string:APP_INVOICE_EXTERNAL_RECEIVER_ACCOUNT)%"
            $projectBillingDefaultDescription: "%env(string:APP_PROJECT_BILLING_DEFAULT_DESCRIPTION)%"

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"

    App\Service\DataProviderService:
        arguments:
            $weekGoalLow: "%env(float:APP_WEEK_GOAL_LOW)%"
            $weekGoalHigh: "%env(float:APP_WEEK_GOAL_HIGH)%"
            $sprintNameRegex: "%env(API_SERVICE_SPRINT_NAME_REGEX)%"
            $transportLocator: "@messenger.receiver_locator"

    App\Service\ClientHelper:
        arguments:
            $options:
                standard_price: "%env(float:CLIENT_STANDARD_PRICE)%"

    App\Controller\IssueController:
        arguments:
            $options:
                issue_product_type_options:
                    quantity_scale: "%env(int:PRODUCT_QUANTITY_SCALE)%"

    App\Service\InvoiceEntryHelper:
        arguments:
            $options:
                accounts: "%env(json:INVOICE_ENTRY_ACCOUNTS)%"

    App\Service\PlanningService:
        arguments:
            $weekGoalLow: "%env(float:APP_WEEK_GOAL_LOW)%"
            $weekGoalHigh: "%env(float:APP_WEEK_GOAL_HIGH)%"

    App\Service\SubscriptionHandlerService:
        arguments:
            $emailFromAddress: "%env(string:EMAIL_FROM_ADDRESS)%"

    App\Command\SyncCommand:
        arguments:
            $monitoringUrl: "%env(string:SYNC_MONITORING_URL)%"

    # Leantime rate-limits its data API and a full sync makes hundreds of paged requests, so the
    # sync spends its time waiting on one host. Everything below configures that one caller;
    # framework.http_client.default_options stays untouched so nothing else inherits these numbers.
    #
    # A scoped client cannot express this: scopes key on base_uri, and the Leantime base URI comes
    # from the DataProvider entity at runtime, not from config.
    app.leantime.rate_limiter:
        class: Symfony\Component\RateLimiter\LimiterInterface
        # Spending the budget before the request rather than reacting to a 429 afterwards. Shared
        # by every Leantime call, since they all compete for the same limit.
        factory: ["@limiter.leantime_api", create]

    app.leantime.http_client.options:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ["@http_client", withOptions]
        arguments:
            # timeout is the idle gap between chunks, not the whole request, so 5s is generous for an
            # API that answers in milliseconds. max_duration bounds one page; if a page ever needs
            # longer, lower LeantimeApiService::LIMIT rather than raising this. Symfony caps neither
            # by default, and an uncapped request holds the worker forever: messenger:consume only
            # checks --time-limit between messages, never during one.
            - { timeout: 5, max_duration: 30 }

    # Deliberately not a RetryableHttpClient. Every Leantime fetch is driven by a message the async
    # transport already retries, and retrying underneath the queue only hides the failure from it.
    app.leantime.http_client:
        class: Symfony\Component\HttpClient\ThrottlingHttpClient
        # Not autoconfigured, which would tag it kernel.reset: ThrottlingHttpClient::reset() resets
        # the limiter with it, and the worker resets services between messages — the window would be
        # wiped after every single request, for every process sharing it. Symfony registers its own
        # scoped-client throttling the same untagged way.
        autoconfigure: false
        arguments:
            $client: "@app.leantime.http_client.options"
            $rateLimiter: "@app.leantime.rate_limiter"

    App\Service\LeantimeApiService:
        arguments:
            $httpClient: "@app.leantime.http_client"
