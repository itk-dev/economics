# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

imports:
    - { resource: create_project_config.local.yaml, ignore_errors: true }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Retry budget for the Leantime data API. Defaults live here rather than in .env so the sync
    # works out of the box; override per environment if Leantime's rate limit changes.
    env(APP_HTTP_CLIENT_RETRY_DELAY_MS): 2000
    env(APP_HTTP_CLIENT_MAX_RETRIES): 3

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

        bind:
            $defaultInvoiceDescriptionTemplate: "%env(APP_INVOICE_DESCRIPTION_TEMPLATE)%"
            $invoiceSupplierAccount: "%env(string:APP_INVOICE_SUPPLIER_ACCOUNT)%"
            $invoiceExternalReceiverAccount: "%env(string:APP_INVOICE_EXTERNAL_RECEIVER_ACCOUNT)%"
            $projectBillingDefaultDescription: "%env(string:APP_PROJECT_BILLING_DEFAULT_DESCRIPTION)%"

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"

    App\Service\DataProviderService:
        arguments:
            $weekGoalLow: "%env(float:APP_WEEK_GOAL_LOW)%"
            $weekGoalHigh: "%env(float:APP_WEEK_GOAL_HIGH)%"
            $sprintNameRegex: "%env(API_SERVICE_SPRINT_NAME_REGEX)%"
            $transportLocator: "@messenger.receiver_locator"

    App\Service\ClientHelper:
        arguments:
            $options:
                standard_price: "%env(float:CLIENT_STANDARD_PRICE)%"

    App\Controller\IssueController:
        arguments:
            $options:
                issue_product_type_options:
                    quantity_scale: "%env(int:PRODUCT_QUANTITY_SCALE)%"

    App\Service\InvoiceEntryHelper:
        arguments:
            $options:
                accounts: "%env(json:INVOICE_ENTRY_ACCOUNTS)%"

    App\Service\PlanningService:
        arguments:
            $weekGoalLow: "%env(float:APP_WEEK_GOAL_LOW)%"
            $weekGoalHigh: "%env(float:APP_WEEK_GOAL_HIGH)%"

    App\Service\SubscriptionHandlerService:
        arguments:
            $emailFromAddress: "%env(string:EMAIL_FROM_ADDRESS)%"

    App\Command\SyncCommand:
        arguments:
            $monitoringUrl: "%env(string:SYNC_MONITORING_URL)%"

    # Leantime rate-limits its data API, and a full sync makes hundreds of paged requests. A 429
    # surfaces inside updateAsJob() before the next page is queued, so without retrying, one of them
    # ends the whole pagination chain. Restores the RetryableHttpClient that was dropped along with
    # the old Jira stack, while the deploy comment still assumes rate limiting is handled.
    Symfony\Component\HttpClient\Retry\RetryStrategyInterface:
        class: Symfony\Component\HttpClient\Retry\GenericRetryStrategy
        # Fetched directly by LeantimeApiServiceRetryTest, which drives the configured strategy
        # against mock responses rather than asserting on a copy of the numbers below.
        public: true
        arguments:
            # A flat list retries on any HTTP method. GenericRetryStrategy's own defaults restrict
            # transport errors (0) and 500/504/507/510 to idempotent methods, which excludes the
            # POSTs the Leantime data API uses even for reads — every one of these calls is a read.
            $statusCodes: [0, 423, 425, 429, 500, 502, 503, 504, 507, 510]
            $delayMs: "%env(int:APP_HTTP_CLIENT_RETRY_DELAY_MS)%"
            $multiplier: 2.0
            # RetryableHttpClient prefers the response's Retry-After header over this backoff, so the
            # cap only bounds the cases where Leantime sends no hint.
            $maxDelayMs: 60000

    app.leantime.http_client:
        class: Symfony\Component\HttpClient\RetryableHttpClient
        arguments:
            $client: "@http_client"
            $strategy: '@Symfony\Component\HttpClient\Retry\RetryStrategyInterface'
            $maxRetries: "%env(int:APP_HTTP_CLIENT_MAX_RETRIES)%"
            $logger: "@logger"

    App\Service\LeantimeApiService:
        arguments:
            $httpClient: "@app.leantime.http_client"
