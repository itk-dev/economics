# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: "%env(APP_SECRET)%"
    #csrf_protection: true
    http_method_override: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    http_client:
        default_options:
            # Symfony caps neither by default, so a Leantime instance that accepts the connection and
            # then stalls holds the messenger worker indefinitely: --time-limit is only checked
            # between messages, never during one.
            #
            # timeout is the idle gap between chunks; max_duration is the whole request. The latter
            # has to clear the /deleted endpoint, which the Leantime plugin does not paginate, so
            # `sync-deleted --interval=P1W` pulls a week of history in one response.
            timeout: 30
            max_duration: 300

    # see https://symfony.com/doc/current/deployment/proxies.html
    trusted_headers:
        [
            "x-forwarded-for",
            "x-forwarded-host",
            "x-forwarded-proto",
            "x-forwarded-port",
            "x-forwarded-prefix",
        ]
    trusted_proxies: "127.0.0.1,REMOTE_ADDR"

when@prod:
    framework:
        error_controller: App\Controller\ErrorController::show

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
