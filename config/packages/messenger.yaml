framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        # The worker is long-lived and the sync cron hourly, so its connection can sit idle past
        # MySQL's wait_timeout. The per-message services reset re-creates a closed EntityManager but
        # cannot see a dead connection under an open one, which otherwise costs one "server has gone
        # away" and a retry per idle stretch. Only messages carrying a ConsumedByWorkerStamp are
        # pinged, so the sync transport and the inline dispatches pay nothing for this.
        buses:
            messenger.bus.default:
                middleware:
                    - doctrine_ping_connection

        transports:
            sync: "sync://"
            # @see https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                # Symfony's three attempts are the right number; 1s/2s/4s is the wrong spacing, over
                # before anything transient has had time to end. Widened to 10s, 30s, 90s, so the
                # last attempt lands 130s after the first failure — past a Leantime restart, a
                # database failover, or a 60s rate-limit window.
                #
                # Not widened further: a page only queues its successor once it succeeds, so a page
                # waiting to be retried is the whole entity type's sync waiting with it, against an
                # hourly cron. This applies to every message on the transport, not only the Leantime
                # ones — the handlers mark a failure unrecoverable only when it describes the message
                # itself, so anything transient reaches the transport.
                retry_strategy:
                    max_retries: 3
                    delay: 10000
                    multiplier: 3
            # @see https://symfony.com/doc/current/messenger.html#saving-retrying-failed-messages
            failed:
                dsn: "%env(MESSENGER_TRANSPORT_DSN_FAILED)%"

        routing:
            # Route your messages to the transports
            'App\Message\UpsertProjectMessage': async
            'App\Message\UpsertVersionMessage': async
            'App\Message\UpsertIssueMessage': async
            'App\Message\UpsertWorklogMessage': async
            'App\Message\LeantimeUpdateMessage': async
            'App\Message\LeantimeDeleteMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: "doctrine://default?queue_name=async"
