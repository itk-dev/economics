framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            sync: "sync://"
            # @see https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                # Spelled out rather than left to Symfony's 1s/2s/4s defaults, which are over before
                # anything transient has had time to end: a Leantime restart, a database failover or
                # a rate-limit window all outlast three attempts inside seven seconds. This applies
                # to every message on the transport, not only the Leantime ones — the handlers mark a
                # failure unrecoverable only when it describes the message itself, so anything
                # transient reaches the transport and now waits long enough to be worth waiting for.
                retry_strategy:
                    max_retries: 5
                    delay: 10000
                    multiplier: 3
                    # 10s, 30s, 90s, 270s, 600s — a little under 17 minutes in total.
                    max_delay: 600000
            # @see https://symfony.com/doc/current/messenger.html#saving-retrying-failed-messages
            failed:
                dsn: "%env(MESSENGER_TRANSPORT_DSN_FAILED)%"

        routing:
            # Route your messages to the transports
            'App\Message\UpsertProjectMessage': async
            'App\Message\UpsertVersionMessage': async
            'App\Message\UpsertIssueMessage': async
            'App\Message\UpsertWorklogMessage': async
            'App\Message\LeantimeUpdateMessage': async
            'App\Message\LeantimeDeleteMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: "doctrine://default?queue_name=async"
