services:
  rabbit:
    image: rabbitmq:4-management-alpine
    networks:
      - app
      - frontend
    ports:
      - "15672"
    environment:
      - "RABBITMQ_DEFAULT_USER=user"
      - "RABBITMQ_DEFAULT_PASS=password"
      - "RABBITMQ_ERLANG_COOKIE=d53f319cd7376f8f840aaf9889f315ab"
    healthcheck:
      # rabbitmq-diagnostics boots an Erlang VM per invocation, so a 1s interval spawns a dozen of
      # them alongside the broker's own ~12s boot and starves it. start_period polls cheaply while
      # booting without counting failures against retries.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 10s
      retries: 5

  node:
    image: node:24
    command: npm run watch
    networks:
      - app
    working_dir: /app
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/app

  nginx:
    environment:
      NGINX_FASTCGI_READ_TIMEOUT: 300
    labels:
      # HTTPS config - uncomment to enable redirect from :80 to :443
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  phpfpm:
    depends_on:
      rabbit:
        condition: service_healthy
    networks:
      - app
      - frontend
